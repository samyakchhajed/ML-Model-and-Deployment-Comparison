name: Deploy ML Workbench to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment tier'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      aws_region:
        description: 'Target AWS deployment region'
        required: true
        default: 'ap-south-1'
        type: string
      auto_rollback_on_failure:
        description: 'Automatically destroy partially created resources if deployment fails'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write   # Required for requesting the OIDC JWT from GitHub
  contents: read    # Required for actions/checkout

jobs:
  deploy:
    name: Build, Provision & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Build Scikit-Learn / ML Lambda Layer
        run: |
          echo "Building Python 3.11 ML Dependencies Layer (scikit-learn, numpy, pandas)..."
          mkdir -p terraform/modules/compute/build/layer/python
          pip install -r backend/requirements.txt \
            -t terraform/modules/compute/build/layer/python \
            --platform manylinux2014_x86_64 \
            --only-binary=:all: \
            --python-version 3.11
          
          echo "Stripping test files, cache, and debugging symbols to fit under 250MB AWS unzipped limit..."
          find terraform/modules/compute/build/layer/python -type d -name "tests" -exec rm -rf {} +
          find terraform/modules/compute/build/layer/python -type d -name "testing" -exec rm -rf {} +
          find terraform/modules/compute/build/layer/python -type d -name "test" -exec rm -rf {} +
          find terraform/modules/compute/build/layer/python -type d -name "__pycache__" -exec rm -rf {} +
          find terraform/modules/compute/build/layer/python -name "*.pyc" -delete
          find terraform/modules/compute/build/layer/python -name "*.pyo" -delete
          find terraform/modules/compute/build/layer/python -type d -name "*.dist-info" -exec rm -rf {} +
          find terraform/modules/compute/build/layer/python -name "*.so" -exec strip --strip-unneeded {} + 2>/dev/null || true
          find terraform/modules/compute/build/layer/python -name "*.so.*" -exec strip --strip-unneeded {} + 2>/dev/null || true
          
          UNZIPPED_MB=$(du -sm terraform/modules/compute/build/layer/python | cut -f1)
          echo "Optimized layer unzipped size: ${UNZIPPED_MB} MB (AWS Limit: 250 MB)"

          cd terraform/modules/compute/build/layer
          zip -rq ../ml_layer.zip python/
          cd -
          echo "ML Layer package built successfully: terraform/modules/compute/build/ml_layer.zip"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region || 'ap-south-1' }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: false

      - name: Ensure Remote S3 State Bucket Exists (Terraform Bootstrap)
        working-directory: terraform/bootstrap
        run: |
          terraform init
          STATE_BUCKET="ml-benchmark-tfstate-ap-south-1"
          if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "Remote state bucket '$STATE_BUCKET' already exists in AWS. Importing into state..."
            terraform import -var="aws_region=${{ inputs.aws_region || 'ap-south-1' }}" aws_s3_bucket.terraform_state "$STATE_BUCKET" || true
          fi
          terraform apply -auto-approve -var="aws_region=${{ inputs.aws_region || 'ap-south-1' }}"

      - name: Terraform Init & Validate
        working-directory: terraform
        run: |
          terraform init
          terraform validate

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ inputs.aws_region || 'ap-south-1' }}" \
            -var="environment=${{ inputs.environment }}"

      - name: Deploy Frontend to S3 Static Website
        run: |
          cd terraform
          API_URL=$(terraform output -raw api_gateway_url)
          SITE_BUCKET=$(terraform output -raw s3_frontend_bucket)
          WEB_URL=$(terraform output -raw website_url)
          cd ..

          echo "Configuring runtime API URL: ${API_URL}"
          echo "window.API_BASE_URL = '${API_URL}';" > frontend/config.js

          echo "Syncing frontend files to s3://${SITE_BUCKET}..."
          aws s3 sync frontend/ s3://${SITE_BUCKET} --delete

          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Web Application** | [${WEB_URL}](${WEB_URL}) |" >> $GITHUB_STEP_SUMMARY
          echo "| **API Gateway** | \`${API_URL}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | \`${{ inputs.aws_region || 'ap-south-1' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Auto-Rollback Partially Provisioned Resources on Failure
        if: failure() && inputs.auto_rollback_on_failure == true
        working-directory: terraform
        run: |
          echo "⚠️ Deployment failed and auto_rollback_on_failure is enabled. Destroying partial resources..."
          terraform destroy -auto-approve \
            -var="aws_region=${{ inputs.aws_region || 'ap-south-1' }}" \
            -var="environment=${{ inputs.environment }}"
          echo "Partial resources destroyed successfully."
